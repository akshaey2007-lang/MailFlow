services:
  # 1. Backend API Service (Django REST Framework + Gunicorn)
  - type: web
    name: mailflow-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: EMAIL_DEV_MODE
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: mailflow-db
          property: connectionString

  # 2. Frontend Dashboard (React + Vite Static Site)
  - type: web
    name: mailflow-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        sync: false

databases:
  # 3. Managed PostgreSQL Database
  - name: mailflow-db
    plan: free
    databaseName: mailflow
    user: mailflow_user
