services:
  db:
    image: postgres:15-alpine
    container_name: mailflow_db
    environment:
      POSTGRES_DB: mailflow_db
      POSTGRES_USER: mailflow_user
      POSTGRES_PASSWORD: mailflow_secure_password_2025
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mailflow_backend
    environment:
      DEBUG: "False"
      SECRET_KEY: "mailflow-production-super-secret-key-replace-in-env"
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      CORS_ALLOWED_ORIGINS: "http://localhost,http://localhost:80,http://127.0.0.1"
      DATABASE_URL: "postgresql://mailflow_user:mailflow_secure_password_2025@db:5432/mailflow_db"
      EMAIL_DEV_MODE: "True"
    depends_on:
      - db
    volumes:
      - media_volume:/app/media
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mailflow_frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  postgres_data:
  media_volume:
